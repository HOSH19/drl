environment:
  grid_size: 15
  state_representation: "feature"
  initial_length: 3
  reward_food: 1.0
  reward_death: -1.0
  reward_step: -0.005
  reward_distance: 0.15

dqn:
  learning_rate: 0.0003
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9998
  replay_buffer_size: 50000
  batch_size: 32
  target_update_frequency: 200
  network: [128, 128]
  activation: "relu"

ppo:
  learning_rate: 0.0005
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  max_grad_norm: 0.5
  update_epochs: 15
  batch_size: 32
  network: [128, 128, 64]
  activation: "relu"

training:
  algorithm: "ppo"
  total_episodes: 5000
  eval_frequency: 100
  save_frequency: 500
  update_frequency: 1
  log_dir: "./logs/snake"
  checkpoint_dir: "./checkpoints/snake"
  experiment_name: "snake_ppo_improved"

evaluation:
  num_episodes: 10
  render: false
  save_videos: false
